spring.application.name=credit-cabinet-backend

# Хранилище: jdbc (PostgreSQL, по умолчанию) или memory (без БД, для быстрых тестов)
app.storage=${APP_STORAGE:jdbc}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:credit_cabinet}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.flyway.enabled=true

# Демопрофили Вики (клиенты, банковские сведения, готовые документы)
app.profiles-file=${PROFILES_FILE:../data/demo-profiles/profiles.json}
# Адрес моков банковских источников. Пусто = читаем bank_data прямо из profiles.json
app.mocks-url=${MOCKS_URL:}
# Адрес documents-service. Пусто = берём документы из profiles.json
app.documents-url=${DOCUMENTS_URL:}
# Запасная учётка сотрудника, если в profiles.json нет секции employees
app.staff.login=${STAFF_LOGIN:employee}
app.staff.password=${STAFF_PASSWORD:employee1234}
app.staff.full-name=Сотрудник банка (демо)
