server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Запросы к API передаём основному серверу (так не нужен CORS)
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 20m;
  }

  # Все остальные адреса отдают страницу приложения
  location / {
    try_files $uri /index.html;
  }
}
