services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  # Остальные сервисы подключаем по мере готовности:
  # backend:         build: ./backend
  # scoring-service: build: ./scoring-service
  # mocks:           build: ./mocks
  # frontend:        build: ./frontend

volumes:
  dbdata:
