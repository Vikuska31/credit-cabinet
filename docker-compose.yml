services:
  # База данных
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Моки банковских источников (имитация)
  mocks:
    build: ./mocks
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data:ro

  # Сервис документов (Вика)
  documents-service:
    build: ./documents-service
    ports:
      - "8002:8002"
    volumes:
      - ./data:/data:ro

  # Основной сервер (Федя)
  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: db
      MOCKS_URL: http://mocks:8001
      DOCUMENTS_URL: http://documents-service:8002
      PROFILES_FILE: /data/demo-profiles/profiles.json
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
      mocks:
        condition: service_started
      documents-service:
        condition: service_started
    ports:
      - "8080:8080"

  # Сайт (Лиза): nginx отдаёт страницы и передаёт /api основному серверу
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

  # Подключаем по мере готовности. Убрать "#" в начале строк,
  # когда у сервиса появится Dockerfile.
  #
  # ai-service:
  #   build: ./ai-service
  #   env_file: .env
  #   ports:
  #     - "8003:8003"

# Именованные хранилища: объявляются здесь, на самом нижнем уровне
volumes:
  dbdata:
  uploads:
