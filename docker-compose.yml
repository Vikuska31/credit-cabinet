services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-credit_cabinet}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Create .env from .env.example}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-credit_cabinet}"]
      interval: 5s
      timeout: 5s
      retries: 10
  mocks:
    build: ./mocks
    volumes:
      - ./data:/data:ro
  documents-service:
    build: ./documents-service
    environment:
      DOCUMENTS_SERVICE_TOKEN: ${DOCUMENTS_SERVICE_TOKEN:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./data:/data:ro
      - uploads:/app/uploads
  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-credit_cabinet}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-}
      MOCKS_URL: http://mocks:8001
      DOCUMENTS_URL: http://documents-service:8002
      DOCUMENTS_SERVICE_TOKEN: ${DOCUMENTS_SERVICE_TOKEN:-}
      PROFILES_FILE: /data/demo-profiles/profiles.json
      STAFF_LOGIN: ${STAFF_LOGIN:-employee}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-employee1234}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_URL: http://ai-service:8003
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-65000}
      APP_TODAY: ${APP_TODAY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
      mocks:
        condition: service_started
      documents-service:
        condition: service_started
    ports:
      - "8080:8080"
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
  ai-service:
    profiles: ["ai"]
    build: ./ai-service
    environment:
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_TOKEN: ${LLM_API_TOKEN:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen3:4b-instruct-2507-q4_K_M}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_REQUEST_TIMEOUT_MS: ${LLM_REQUEST_TIMEOUT_MS:-60000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1200}
      AI_MAX_CONCURRENT_REQUESTS: ${AI_MAX_CONCURRENT_REQUESTS:-1}
      AI_MAX_QUEUED_REQUESTS: ${AI_MAX_QUEUED_REQUESTS:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  dbdata:
  uploads:
