services:
  # База данных
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Моки банковских источников (имитация)
  mocks:
    build: ./mocks
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data:ro

  # Подключаем по мере готовности. Убрать "#" в начале строк,
